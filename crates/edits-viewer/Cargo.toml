[package]
name = "edits-viewer"
description = "EditsEditor live viewer: watch agents edit in real time, scrub, play, inspect and tweak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "edits-viewer"
path = "src/main.rs"

[dependencies]
edits-core.workspace = true
edits-fx.workspace = true
edits-media.workspace = true
edits-render.workspace = true
edits-engine.workspace = true
eframe.workspace = true
egui.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
cpal.workspace = true
rfd.workspace = true

[lints]
workspace = true
